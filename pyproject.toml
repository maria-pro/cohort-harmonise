[project]
name = "cohort-harmonise"
version = "0.1.0"
description = "Dictionary-first harmonisation and claim auditing across six youth-development cohorts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "pyyaml>=6.0"]

[project.scripts]
harmonise = "harmonise.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmonise"]
