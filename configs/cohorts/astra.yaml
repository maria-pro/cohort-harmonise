citations:
  overview:
    ref: >-
      Motti-Stefanidi F. Acculturation and resilience of immigrant-origin youth: Do their school
      experiences reflect nonimmigrants' "native supremacy"? Development and Psychopathology. 2023;35(5).
    doi: "10.1017/S0954579423000895"
    note: >-
      Table 1 'AStRA project adaptation indices' lists the adaptation variables and the informant
      for each. Three cohorts, three annual waves each, mean age 12 at wave 1, informants =
      adolescent self-report, teacher ratings, peer sociometric nominations and school records.
  pi_page:
    ref: "Motti-Stefanidi F. Scientific activities (project page)."
    url: "https://frossomotti.com/scientific-activities/"
    note: "Cohort periods 2005-2007, 2013-2015, 2020-2023; over 3,500 participants."
  personality:
    ref: >-
      Gillespie S, Shiner R, Masten AS, Motti-Stefanidi F. Personality development in immigrant and
      non-immigrant adolescents: Disruption or maturation? European Journal of Personality.
    doi: "10.1177/08902070221127386"
    note: "Big Five self-reported at all three annual waves in the 2013 cohort."
