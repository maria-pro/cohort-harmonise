# Cohort 5 — AStRA. Tier 2, tests historical era. No custodian dictionary and no public codebook.
cohort_id: astra
short_name: AStRA
name: "Athena Studies of Resilient Adaptation"
country: GRC
cohort_number: 5
tier: "2"
tier_rationale: >-
  Historical era — three cohorts entering middle school in three successive technological
  and economic eras in one country.
