# Cohort 3 — TESS. Tier 1, carries primary analysis. No custodian dictionary held.
cohort_id: tess
short_name: TESS
name: "Trondheim Early Secure Study"
country: NOR
cohort_number: 3
tier: "1"
tier_rationale: >-
  Primary analysis cohort, and the strongest clinical anxiety phenotype in the set
  (diagnostic interviews rather than symptom scales).
release: "Instrument matrix T1-T10 supplied by the study custodian, 2026-09-09."
n_approx: 1250
n_note: "N = 3,456 invited; 1,250 drawn; 997 participated at wave 1 (Steinsbekk & Wichstrom 2018)."
started: 2007
evidence_tier: custodian_documentation
governance:
  restricted: false
  note: "Access is via the study custodians at NTNU. No public codebook is published."
citations:
  instruments_matrix:
    ref: >-
      TESS instrument matrix, T1-T10 (ages 4 to 22), supplied by CI Lars Wichstrom,
      9 September 2026. Unpublished study documentation; not redistributed with this
      repository.
    note: >-
      Instrument by wave by informant for child/adolescent self-report and interview,
      parent report about the child, parent report about themselves, teacher and school
      report, health-clinic records, and observation and testing.
  profile:
    ref: "Steinsbekk S, Wichstrom L. Cohort Profile: The Trondheim Early Secure Study (TESS). Int J Epidemiol. 2018;47(5):1401-1401i."
    url: "https://academic.oup.com/ije/article/47/5/1401/5094968"
    note: >-
      Table 2 'Measurements applied in the TESS study' is a domain x age x informant matrix
      covering ages 4-14. Informant codes: Ip parent interview, Is child interview/self-report,
      Qt teacher questionnaire, Qdl day-care leader questionnaire, O observation, T tests,
      R register information.
  waves:
    ref: "TESS study page, NTNU."
    url: "https://www.ntnu.edu/tess"
    note: "Assessments at ages 4, 6, 8, 10, 12, 14, 16, 18, 20 complete; age 22 is the tenth wave and ongoing."
  anxiety:
    ref: "Steinsbekk S, Ranum B, Wichstrom L. Prevalence and course of anxiety disorders and symptoms from preschool to adolescence: a 6-wave community study. J Child Psychol Psychiatry. 2022."
    doi: "10.1111/jcpp.13487"
    note: >-
      PAPA at ages 4 and 6, CAPA thereafter. Anxiety disorders enumerated as specific phobia,
      generalised anxiety, separation anxiety and social anxiety disorder.
  social_media:
    ref: "Nobakht HN, Wichstrom L, Steinsbekk S. Social Media Use and the Quality of Family Relationships: A Six-Wave Longitudinal Study from Age 10 to 20. J Youth Adolesc. 2026."
    doi: "10.1007/s10964-026-02362-5"
    note: >-
      n = 979 across six biennial waves, ages 10-20. Social media checking frequency, activity and
      screen time 'assessed using interviews and objective measures'. The nature of the objective
      measure is not specified in the abstract, so app-level time-stamped capture is NOT
      established by this source and is flagged for custodian confirmation.
source:
  kind: documented
  # Domain-level inventory. Wave lists are ages, matching how TESS documentation reports them.
  entries:
    - {domain: "Mental health diagnoses (anxiety modules)", instrument: "CAPA (8-14); K-SADS and SCID-5-PF (16); SCID / SCID-5-PF (18-22)", respondent: "child interview", ages: [8, 10, 12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Mental health of child (parent report)", instrument: "PAPA (4-6); CAPA (8-14); K-SADS and SCID-PF (16-18); CBCL at every wave 4-18", respondent: "parent interview and questionnaire", ages: [4, 6, 8, 10, 12, 14, 16, 18], confidence: verified, cite: instruments_matrix}
    - {domain: "Mental health of child (teacher report)", instrument: "SDQ and TRF 1.5-5 (4); TRF 6-18 (6); TRF (8-18, externalising only from 16)", respondent: "teacher questionnaire", ages: [4, 6, 8, 10, 12, 14, 16, 18], confidence: verified, cite: instruments_matrix}
    - {domain: "Worrying", instrument: "PSWQ", respondent: "child self-report", ages: [12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Rumination", instrument: "RRS (12); RRS plus co-rumination (14-22)", respondent: "child self-report", ages: [12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Loneliness", instrument: "UCLA-LS", respondent: "child self-report", ages: [12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Social withdrawal", instrument: "CSPS", respondent: "teacher questionnaire", ages: [6, 8, 10, 12, 14, 16, 18], confidence: verified, cite: instruments_matrix}
    - {domain: "Sleep and sleep disorders", instrument: "Interview (8-18); insomnia only (20-22)", respondent: "child interview", ages: [8, 10, 12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Sleep and sleep disorders (parent report)", instrument: "Interview", respondent: "parent interview", ages: [10, 12, 14, 16, 18], confidence: verified, cite: instruments_matrix}
    - {domain: "Screen use", instrument: "Interview (8-14); interview plus a screenshot of the phone's own seven-day app time-use (16-22)", respondent: "child interview plus device screenshot", ages: [8, 10, 12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Screen use (parent report)", instrument: "Interview", respondent: "parent interview", ages: [6, 8, 12], confidence: verified, cite: instruments_matrix}
    - {domain: "Social media use", instrument: "Questionnaire", respondent: "child self-report", ages: [10, 12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Internet gaming disorder", instrument: "IGDI", respondent: "child self-report", ages: [10, 12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Fear of missing out", instrument: "FoMOs", respondent: "child self-report", ages: [16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Cyberbullying", instrument: "CBVEQ-G", respondent: "child self-report", ages: [14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Bullying and victimisation", instrument: "OBVQ (8-12); victimisation only (14-22); Olweus single item, parent (4-18)", respondent: "child self-report; parent", ages: [8, 10, 12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Physical activity", instrument: "IPAQ, parent (6-8); sports participation questionnaire (6-18)", respondent: "parent questionnaire", ages: [6, 8, 10, 12, 14, 16, 18], confidence: verified, cite: instruments_matrix}
    - {domain: "Emotion regulation", instrument: "ERC, parent and teacher (6-18); ERQ, self-report (20)", respondent: "parent; teacher; child self-report", ages: [6, 8, 10, 12, 14, 16, 18, 20], confidence: verified, cite: instruments_matrix}
    - {domain: "Quality of life and wellbeing", instrument: "UK Millennium Study, 7 items", respondent: "child self-report", ages: [14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Self-esteem", instrument: "SDQ-I (6-10); SDQ-II and SPPA-R (12); SPPA-R (14-18); SPPA-Adult (20-22)", respondent: "child self-report", ages: [6, 8, 10, 12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Peer, parent and partner relationships", instrument: "BPI (4-6); NRI (10-22)", respondent: "child self-report", ages: [4, 6, 10, 12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "School functioning and grades", instrument: "Teacher report (TRF) and school records", respondent: "teacher; register", ages: [6, 8, 10, 12, 14, 16, 18], confidence: verified, cite: instruments_matrix}
    - {domain: "Social skills", instrument: "SSRS", respondent: "parent; teacher", ages: [4, 6, 8, 10, 12, 14, 16, 18], confidence: verified, cite: instruments_matrix}
    - {domain: "Life events", instrument: "List from CAPA/PAPA and K-SADS; A and B events", respondent: "child self-report; parent", ages: [12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Stress and coping", instrument: "A-Cope-N", respondent: "child self-report", ages: [14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Social support", instrument: "MSPSS, 12 items", respondent: "child self-report", ages: [20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Personality", instrument: "BFI", respondent: "child self-report", ages: [10, 12, 14, 16, 18, 20, 22], confidence: verified, cite: instruments_matrix}
    - {domain: "Service use, mental health", instrument: "CASA interview", respondent: "parent interview", ages: [4, 6, 8, 10, 12, 14, 16, 18], confidence: verified, cite: instruments_matrix}
