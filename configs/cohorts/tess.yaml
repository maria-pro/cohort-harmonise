  - {wave_id: "age8", wave_year: 2012, year_source: derived, age_range: "8", digital_era: Web3, wave_kind: primary}
  - {wave_id: "age10", wave_year: 2014, year_source: derived, age_range: "10", digital_era: Web3, wave_kind: primary}
  - {wave_id: "age12", wave_year: 2016, year_source: derived, age_range: "12", digital_era: Web3, wave_kind: primary}
  - {wave_id: "age14", wave_year: 2018, year_source: derived, age_range: "14", digital_era: Web3, wave_kind: primary}
  - {wave_id: "age16", wave_year: 2020, year_source: derived, age_range: "16", digital_era: Web4, wave_kind: primary}
