# Target constructs, instrument aliases and thresholds.
# Every construct traces to a named element of the application's WP1 / Table B2.

periodisation:
  # Table B2 step 4 puts digital era inside the exposure definition, so era must travel
  # with every row rather than being inferred later. Boundaries are configurable.
  citation_slot: "Web 1-4 periodisation — insert the application's reference 21 here."
  bands:
    - {era: Web1, to: 2003}
    - {era: Web2, from: 2004, to: 2009}
    - {era: Web3, from: 2010, to: 2019}
    - {era: Web4, from: 2020}

# The application's vocabulary is not the dictionaries' vocabulary. This layer is what
# reconciles them, and its misses are reported rather than silently dropped.
instruments:
  - id: scas_cas8
    canonical: "SCAS short form (CAS-8)"
    aliases: ["spence children", "spence child", "spence anxiety", "scas", "cas-8", "cas8", "child anxiety scale"]
    note: "The application uses both 'SCAS short form' and 'CAS-8' for the same instrument."
  - id: gad7
    canonical: "Generalised Anxiety Disorder 7-item (GAD-7)"
    aliases: ["gad-7", "gad7", "generalised anxiety disorder 7", "generalized anxiety disorder 7"]
  - id: sdq_emotional
    canonical: "SDQ Emotional Symptoms subscale"
    aliases: ["emotional symptom", "sdq emotional"]
  - id: sdq
    canonical: "Strengths and Difficulties Questionnaire"
    aliases: ["strengths and difficulties", "sdq"]
  - id: cbcl
    canonical: "Child Behavior Checklist"
    aliases: ["child behavior checklist", "child behaviour checklist", "cbcl"]
  - id: ksads
    canonical: "K-SADS"
    aliases: ["ksads", "k-sads", "kiddie schedule", "schedule for affective disorders and schizophrenia"]
  - id: papa_capa
    canonical: "PAPA / CAPA diagnostic interviews"
    aliases: ["papa", "capa", "preschool age psychiatric assessment", "child and adolescent psychiatric assessment"]
  - id: k10
    canonical: "Kessler Psychological Distress Scale"
    aliases: ["kessler", "k10", "k-10", "k6", "k-6"]
  - id: phq
    canonical: "Patient Health Questionnaire"
    aliases: ["patient health questionnaire", "phq-9", "phq9", "phq-4"]

constructs:
  # ---- Outcome ----
  - id: anx_symptoms
    label: "Anxiety symptoms (continuous severity)"
    role: outcome
    core: true
    b2_step: "1, 3"
    preferred_instruments: [scas_cas8, gad7, sdq_emotional, cbcl, ksads, papa_capa]
    documented_match:
      any_of: ["anxiet", "worry", "emotional symptom", "internalis", "dsm symptom", "psychiatric"]
    match:
      any_of: ["anxiet", "anxious", "\\bworry\\b", "worried", "\\bnervous", "\\bfearful", "\\bphobia", "\\bpanic", "\\btense\\b"]
      exclude: ["anxiety about money owed", "dental anxiety"]
  - id: anx_caseness
    label: "Anxiety caseness and transition status"
    role: outcome
    core: true
    b2_step: "2"
    requires_threshold: true
    preferred_instruments: [scas_cas8, gad7, cbcl, ksads, papa_capa]
    documented_match:
      any_of: ["anxiet", "dsm symptom", "psychiatric", "diagnos"]
    match:
      any_of: ["anxiet", "anxious", "\\bphobia", "\\bpanic", "separation anxiety", "social anxiety"]
  - id: internalising_broad
    label: "Broad internalising / emotional symptoms"
    role: outcome_secondary
    core: true
    note: "Serves where anxiety-specific measurement is unavailable (application: cohort 5)."
    preferred_instruments: [sdq_emotional, cbcl, k10, phq]
    documented_match:
      any_of: ["internalis", "emotional symptom", "depress", "wellbeing", "well-being", "mental health", "psychiatric"]
    match:
      any_of: ["internalis", "internaliz", "emotional symptom", "emotional problem", "depress", "\\bmood\\b", "psychological distress", "unhappy", "\\bsad\\b"]

  # ---- WP1 predictors named in the application ----
  - id: sleep_duration
    label: "Sleep duration"
    role: predictor
    core: true
    documented_match:
      any_of: ["\\bsleep\\b"]
    match:
      any_of: ["hours.*sleep", "sleep.*hours", "sleep duration", "how (much|long).*sleep", "time asleep", "total sleep"]
  - id: sleep_timing
    label: "Sleep timing (bed and wake time), including late-night"
    role: predictor
    core: true
    documented_match:
      any_of: ["\\bsleep\\b"]
    match:
      any_of: ["bed ?time", "go to bed", "went to bed", "wake ?(up )?time", "woke up", "time.*fall asleep", "sleep onset", "lights out"]
  - id: sleep_irregularity
    label: "Sleep irregularity and quality"
    role: predictor
    core: false
    documented_match:
      any_of: ["\\bsleep\\b"]
    match:
      any_of: ["trouble sleeping", "difficulty sleeping", "sleep problem", "sleep quality", "restless sleep", "night ?wak", "wake.*during the night", "insomnia", "sleep pattern", "sleep routine"]
  - id: late_night_device_use
    label: "Late-night device use"
    role: predictor
    core: false
    note: "Requires a night/bedtime term AND a device/screen term in the same field."
    match:
      all_of_groups:
        - ["night", "bed ?time", "\\bin bed\\b", "lights out", "\\blate\\b", "before (bed|sleep)", "after dark", "midnight"]
        - ["screen", "phone", "mobile", "device", "internet", "online", "social media", "comput", "tablet", "\\btv\\b", "gam(e|ing)", "text"]
  - id: social_withdrawal
    label: "Social withdrawal"
    role: predictor
    core: true
    documented_match:
      any_of: ["withdraw", "lonel", "social skill", "peer"]
    match:
      any_of: ["withdraw", "\\blonely", "loneliness", "\\bshy\\b", "prefers to be alone", "rather be alone", "socially isolat", "avoids? (other )?(children|people|peers)", "keeps to (him|her|them)self", "stopped (doing|going)", "dropped out of"]
      # "Withdrawal" is also a contraceptive method and a substance-cessation term.
      exclude: ["prevent pregnancy", "contracept", "withdrawal method", "alcohol withdrawal", "drug withdrawal", "nicotine withdrawal"]
  - id: digital_exposure_broad
    label: "Broad digital exposure"
    role: predictor
    core: true
    documented_match:
      any_of: ["screen", "social media", "internet", "gaming", "digital"]
    match:
      any_of: ["screen time", "screen use", "social media", "internet use", "time online", "\\bgaming\\b", "video game", "mobile phone use", "smartphone", "\\bapps?\\b", "watching (tv|television)", "electronic (media|device)"]

  # ---- Cross-cohort developmental core (application: what all six actually measure) ----
  - id: physical_activity
    label: "Physical activity"
    role: core_layer
    core: true
    note: "Application states 'by report in all six and objectively by wearables in cohorts 1 and 2'."
    documented_match:
      any_of: ["physical activity", "\\bactivity\\b", "\\beating\\b", "\\bexercise"]
    match:
      any_of: ["physical activity", "\\bexercise", "\\bsport", "active (play|travel)", "steps per day", "accelerometer", "actigraph", "moderate.*vigorous", "\\bmvpa\\b"]
  - id: functioning
    label: "Education and functioning"
    role: core_layer
    core: true
    documented_match:
      any_of: ["academic", "school", "achievement", "engagement", "absentee", "executive function"]
    match:
      any_of: ["school (achievement|performance|grade|engagement|attendance|absen)", "academic", "\\bnaplan\\b", "\\bgrades?\\b", "truan", "impairment", "functioning", "\\bhomework\\b", "school refus"]
  - id: social_context
    label: "Social context (peers, family, community)"
    role: core_layer
    core: true
    documented_match:
      any_of: ["peer", "family", "parent", "victimis", "bully", "community", "housing", "likeab", "classmate"]
    match:
      any_of: ["\\bpeer", "\\bfriend", "\\bbull(y|ie|ying)", "victimis", "victimiz", "\\bteased?\\b", "family (relationship|function|conflict|climate)", "parent(-| )child", "\\bneighbourhood\\b", "\\bneighborhood\\b", "\\bcommunity\\b", "social support"]

  # ---- Declared non-harmonisable (Table B2 step 5). A reason is mandatory. ----
  - id: digital_function_reassurance
    label: "Digital function: reassurance seeking"
    role: mechanism
    declared_non_harmonisable: true
    reason: >-
      Reassurance seeking through a digital channel is not measured by the slow-clock cohorts.
      Forcing it onto a general screen-time item would create false equivalence between an
      exposure quantity and a maintaining mechanism. Analysed within cohort only; captured
      prospectively by WP2 and WP3.
    affects_cohorts: [lsac, abcd, tess, ttm, astra, lsic]
    match:
      all_of_groups:
        - ["reassurance", "checking whether.*upset", "asked (again|repeatedly)", "seeking approval"]
        - ["online", "internet", "social media", "\\bapp\\b", "\\bphone", "message", "\\btext", "digital", "\\bchat"]
  - id: digital_function_avoidance
    label: "Digital function: avoidance and substitution"
    role: mechanism
    declared_non_harmonisable: true
    reason: >-
      Using a digital channel to avoid or substitute for in-person contact is not
      distinguished from ordinary use in any slow-clock cohort's items.
    affects_cohorts: [lsac, abcd, tess, ttm, astra, lsic]
    match:
      all_of_groups:
        - ["avoidance", "avoid(s|ed)? (talking|contact|situation)", "instead of (talking|seeing|meeting)", "rehears"]
        - ["online", "internet", "social media", "\\bapp\\b", "\\bphone", "message", "\\btext", "digital", "\\bchat"]
  - id: digital_function_support_seeking
    label: "Digital function: support and help seeking through a digital channel"
    role: mechanism
    # Not declared non-harmonisable. Running this tool showed the claim was too strong for
    # this one function: LSAC (14/15 and 16/17 y), Ten to Men and LSIC each ask whether help
    # was sought from the internet or a phone helpline. That is a coarse source endorsement,
    # not the function itself, so it harmonises as a proxy and never as a direct measure.
    partial_coverage_note: >-
      Available as a binary source endorsement ("sought help from the internet / a phone help
      line") in LSAC, Ten to Men and LSIC. It does not distinguish reassurance seeking from
      genuine help seeking and carries no timing, so it supports a cross-cohort proxy for
      digital help seeking but not the maintaining mechanism WP2 and WP3 measure.
    match:
      all_of_groups:
        - ["help ?seeking", "sought help", "talk to someone about", "disclos"]
        - ["online", "internet", "social media", "\\bapp\\b", "\\bphone", "message", "\\btext", "digital", "\\bchat"]
  - id: intolerance_uncertainty
    label: "Intolerance of uncertainty"
    role: mechanism
    declared_non_harmonisable: true
    reason: "A proximal cognitive mechanism absent from the slow-clock cohorts' instruments. Added by WP2."
    affects_cohorts: [lsac, abcd, tess, ttm, astra, lsic]
    match:
      any_of: ["intolerance of uncertainty", "uncertain(ty)?.*(distress|upset|cope)", "need to know for (sure|certain)"]
  - id: rumination
    label: "Rumination"
    role: mechanism
    # Not declared non-harmonisable: at least one Tier 1 cohort measures it repeatedly
    # across waves. The instrument and wave detail comes from documentation a custodian
    # supplied privately and has not agreed to publish, so it is held in the gitignored
    # configs/cohorts/local/ overlay rather than stated here.
    partial_coverage_note: >-
      Measured repeatedly in one Tier 1 cohort and absent from the others, so it cannot be
      harmonised across cohorts but is available for a within-cohort test of a WP2
      mechanism. Source detail withheld pending custodian consent.
    documented_match:
      any_of: ["ruminat"]
    match:
      any_of: ["ruminat", "\\bbrood", "keep thinking about", "dwell(ing)? on", "repetitive (negative )?think"]
  - id: ai_interaction
    label: "AI interaction (both sides of the exchange)"
    role: mechanism
    declared_non_harmonisable: true
    reason: >-
      No slow-clock cohort measures interaction with a conversational AI. This is what WP3 adds,
      and its absence here is the empirical basis for that claim rather than an assumption.
    affects_cohorts: [lsac, abcd, tess, ttm, astra, lsic]
    match:
      any_of: ["\\bchatbot", "conversational (ai|agent)", "\\bchatgpt", "\\bai (assistant|companion)", "generative ai", "\\bllm\\b", "virtual assistant"]

# Table B2 step 2. A threshold without a citation is a defect, not a default.
thresholds:
  # Sex-specific by construction, which makes LSAC's threshold-crossing outcome
  # inherently sex-differentiated rather than sex-adjusted after the fact.
  - construct: anx_caseness
    cohort: lsac
    instrument: scas_cas8
    rule: "CAS-8 total >= 13 (males), >= 16 (females)"
    sex_specific:
      male: 13
      female: 16
    scale_range: "0-24 (8 items, 0-3)"
    status: cited_secondary
    citation: >-
      Spence SH, March S, Donovan CL. Social support as a predictor of treatment adherence
      and response in an open-access, self-help, internet-delivered cognitive behaviour
      therapy program for child and adolescent anxiety. Internet Interventions.
      2019;18:100268. Applied to LSAC in Epidemiol Psychiatr Sci 2025 (PMC12555079) and
      BMC Psychiatry 2024 (doi:10.1186/s12888-024-05752-w).
    primary_source_unresolved: >-
      The rule is citable but its derivation is not. Both published LSAC analyses that use
      these cut-offs cite the same source, Spence, March and Donovan (2019), Internet
      Interventions 18:100268, and that paper does state the rule verbatim: a CAS-8 score
      of 13 or more for males and 16 or more for females is "considered representative of
      clinical levels of anxiety", at the 94th percentile of gender-standardised norms.
      The problem is one step further back. Spence (2019) and March et al. (2018, JMIR
      20(7):e234) both attribute those norms to Spence, Sawyer, Sheffield, Patton, Bond,
      Graetz and Kay (2014), Int J Environ Res Public Health 11(5):5113-5132, which uses
      the 8-item scale but publishes no norms, no percentiles and no cut-offs. The chain
      therefore terminates in a paper that does not contain the derivation. Reardon et al.
      (2018) is not a substitute: different item set, and derived in children aged 7-11.
      Cite Spence, March and Donovan (2019) as the source the LSAC literature uses, and
      state that the underlying norms are unpublished, or pre-specify a distributional
      threshold instead. Note also a scale-range discrepancy worth resolving with AIFS:
      BMC Psychiatry 2024 describes the CAS-8 response options as 1-4, while cut-offs of
      13 and 16 imply 0-3 scoring over a 0-24 range.
  - {construct: anx_caseness, cohort: abcd,  instrument: ksads,     rule: "Meets K-SADS diagnostic criteria (not a threshold)", citation: "Kaufman J et al. Schedule for Affective Disorders and Schizophrenia for School-Age Children. J Am Acad Child Adolesc Psychiatry. 1997;36(7):980-8.", status: cited}
  # T >= 65 / >= 70 are the ASEBA cut-points for the NARROWBAND syndrome and DSM-oriented
  # scales. The BROADBAND Internalising, Externalising and Total Problems scales use
  # T = 60-63 borderline and T >= 64 clinical. The application currently states 65 for
  # Internalising, which is the wrong scale's threshold.
  - {construct: anx_caseness, cohort: abcd,  instrument: cbcl,      rule: "CBCL Internalising (broadband) T 60-63 borderline, T >= 64 clinical", citation: "Achenbach TM, Rescorla LA. Manual for the ASEBA School-Age Forms and Profiles. Burlington VT: University of Vermont; 2001.", status: cited, note: "If a narrowband anxiety syndrome or DSM-oriented anxiety-problems scale is used instead, the cut-points are T 65-69 borderline and T >= 70 clinical. State which scale is meant."}
  - {construct: anx_caseness, cohort: tess,  instrument: papa_capa, rule: "DSM diagnostic status from PAPA/CAPA", citation: "Steinsbekk, Ranum & Wichstrom 2022, doi:10.1111/jcpp.13487", status: cited}
  - {construct: anx_caseness, cohort: ttm,   instrument: gad7,      rule: "GAD-7 >= 10", citation: "Spitzer RL, Kroenke K, Williams JBW, Lowe B. A brief measure for assessing generalized anxiety disorder: the GAD-7. Arch Intern Med. 2006;166(10):1092-7.", status: cited, note: "WP2 uses >=11 at 12-17 y and >=10 at 18-25 y as its own clinical anchor. Do not conflate the two."}
  - {construct: anx_caseness, cohort: lsic,  instrument: null,      rule: "Not applicable — see governance", citation: "n/a", status: governed}
  - {construct: anx_caseness, cohort: astra, instrument: null,      rule: "No anxiety-specific threshold documented", citation: "n/a", status: absent}
