name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        run: pytest -q

      # The cohort dictionaries are not redistributable, so CI cannot run the full
      # pipeline. The two cohorts documented from publications need no files, which is
      # enough to prove the pipeline runs end to end and writes its reports.
      - name: Smoke test the pipeline without any dictionary files
        run: |
          harmonise run --outdir /tmp/out
          test -f /tmp/out/coverage_matrix.html
          test -f /tmp/out/claim_audit.csv
          test -f /tmp/out/non_harmonisable_register.csv
          test -f /tmp/out/provenance.json
          test -f /tmp/out/custodian_template_tess.csv
