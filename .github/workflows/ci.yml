name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        run: pytest -q

      # The cohort dictionaries are not redistributable, so CI cannot check the claims:
      # a green build here means the code runs, NOT that the application's assertions
      # hold. The gate that checks the claims is
      #
      #     harmonise audit --strict --require-cohorts lsac,abcd,ttm,lsic
      #
      # which must be run wherever the dictionaries live, and which exits non-zero on any
      # MISMATCH and refuses to report at all if a required dictionary is missing.
      # UNVERIFIABLE does not fail it, so a cohort with no codebook does not block.
      #
      # The step below only proves the pipeline runs end to end and writes its reports,
      # using the two cohorts documented from publications, which need no files.
      - name: Smoke test the pipeline without any dictionary files
        run: |
          harmonise run --outdir /tmp/out
          test -f /tmp/out/coverage_matrix.html
          test -f /tmp/out/claim_audit.csv
          test -f /tmp/out/non_harmonisable_register.csv
          test -f /tmp/out/provenance.json
          test -f /tmp/out/custodian_template_tess.csv
